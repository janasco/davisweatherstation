name: Feature request
description: Suggest an improvement to the site, catalog, or buying guide
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need or friction you have noticed.
      placeholder: It would help if the buying guide could ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Homepage
        - Reseller directory
        - Product catalog
        - Smart Buying Guide
        - Quote form
        - FAQ
        - Content / SEO
        - Other

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this request.
          required: true
