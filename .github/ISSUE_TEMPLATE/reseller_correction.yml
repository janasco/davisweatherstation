name: Reseller correction
description: Report outdated or incorrect reseller information
title: "[Reseller]: "
labels: ["data", "resellers"]
body:
  - type: input
    id: reseller
    attributes:
      label: Reseller name
      placeholder: Apexs, Incorporated
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country
      placeholder: Philippines
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Reseller profile URL
      placeholder: https://davisweatherstation.com/resellers/apexs

  - type: dropdown
    id: issue
    attributes:
      label: What needs correcting?
      options:
        - Contact details (phone / email)
        - Address
        - Website
        - Designation (repair center, installer, agriculture specialist)
        - Reseller-since year
        - Description / background
        - Reseller removed or no longer authorized
        - Other
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Correct information
      description: Please include the exact replacement text where possible.
      placeholder: The phone number should be ...
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source
      description: Link to the reseller's official page or other evidence.
      placeholder: https://...

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This information comes from an official or verifiable source.
          required: true
